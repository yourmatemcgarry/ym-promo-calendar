<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Timeline Tracker</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e0e2e7; --text:#1f2430; --muted:#6b7280;
    --accent:#2563eb; --accent-light:#dbeafe; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  button{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;}
  button:hover{background:#f0f1f4;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{background:#1d4ed8;}
  button.danger{background:#fff;color:var(--red);border-color:#fca5a5;}
  button.danger:hover{background:#fef2f2;}
  button.ghost{border-color:transparent;background:transparent;padding:6px 8px;}
  main{padding:16px 20px 40px;max-width:1560px;margin:0 auto;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;}
  .filters label{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px;}
  .filters select, .filters input[type=text]{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-left:auto;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .view-toggle button{border:none;border-radius:0;}
  .view-toggle button.active{background:var(--accent);color:#fff;}
  .sku-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--muted);padding:0 4px 12px;align-items:center;}
  .sku-legend .chip{display:flex;align-items:center;gap:5px;}
  .sku-legend .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* Gantt
     Layout: a frozen pane (chain logo rail + SKU labels, never scrolls horizontally) sits next
     to the scrollable timeline pane. Their vertical scroll is kept in sync with a CSS transform
     driven by the timeline pane's scroll event — this avoids relying on `position: sticky`
     inside CSS Grid, which some browsers stop honoring correctly once a grid track spans many
     rows and the page is scrolled far (columns were observed shrinking away entirely). */
  .gantt-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .gantt-nav{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);}
  .gantt-body{display:flex;align-items:stretch;}
  .gantt-frozen{flex:none;width:298px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);}
  .frozen-header{height:40px;flex:none;display:flex;border-bottom:1px solid var(--border);}
  .frozen-header .fh-rail{width:108px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-right:1px solid var(--border);}
  .frozen-header .fh-label{flex:1;display:flex;align-items:center;padding-left:10px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .frozen-viewport{flex:1;overflow:hidden;position:relative;max-height:calc(70vh - 40px);}
  .frozen-inner{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:108px 190px;will-change:transform;}
  .gantt-scroll{overflow:auto;max-height:70vh;position:relative;flex:1;min-width:0;}
  .gantt-grid{display:grid;}
  .axis-cell{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--border);height:40px;}

  /* Chain rail: the logo+name block spans every row belonging to that chain in the frozen pane
     (mirroring how the old Excel tracker anchored a tall chain-logo image down column A). */
  .chain-rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;text-align:center;}
  .chain-rail.chain-start{border-top:2px solid var(--border);}
  .chain-rail .logo,.chain-rail .logo-fallback{width:40px;height:40px;border-radius:8px;flex:none;}
  .chain-rail .logo{object-fit:cover;background:#fff;border:1px solid var(--border);}
  .chain-rail .logo-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .chain-rail .name{font-weight:700;font-size:11px;line-height:1.25;word-break:break-word;}
  .chain-rail .cycle-pill{font-size:9.5px;color:var(--muted);background:#f0f1f4;padding:1px 6px;border-radius:8px;}
  .chain-rail .rail-actions{display:flex;gap:4px;}
  .chain-rail .rail-actions button{padding:1px 6px;font-size:11px;line-height:1.4;}

  .label-cell{background:var(--panel);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .label-cell.chain-start{border-top:2px solid var(--border);}
  .label-cell .sku-row-top{display:flex;align-items:center;gap:7px;}
  .label-cell .sku-name{font-weight:600;font-size:12.5px;}
  .label-cell .sku-code{color:var(--muted);font-size:10.5px;}
  .label-cell .sku-actions{display:flex;gap:5px;margin-left:auto;}
  .label-cell .sku-actions button{padding:1px 5px;font-size:10.5px;}
  .cycle-label-cell{background:#fafbfc;padding:2px 10px;display:flex;align-items:center;font-size:9.5px;color:var(--muted);}
  .cycle-label-cell.chain-start{border-top:2px solid var(--border);}
  .track-cell{position:relative;border-bottom:1px solid var(--border);}
  .track-cell.chain-start{border-top:2px solid var(--border);}
  .cycle-row{position:relative;border-bottom:1px solid var(--border);background:#fafbfc;}
  .cycle-row.chain-start{border-top:2px solid var(--border);}
  .cycle-tick{position:absolute;top:0;height:100%;border-left:1px solid #e3e5ea;padding-left:4px;font-size:9.5px;color:var(--muted);line-height:18px;white-space:nowrap;}
  .month-line{position:absolute;top:0;bottom:0;border-left:1px solid #e3e5ea;}
  .month-line.major{border-left:1px solid #c9ccd4;}
  .today-line{position:absolute;top:0;bottom:0;border-left:2px solid var(--red);z-index:1;}
  .axis-month{position:absolute;top:0;height:22px;font-size:11.5px;font-weight:700;color:var(--text);border-left:1px solid #c9ccd4;padding-left:4px;line-height:22px;}
  .axis-week{position:absolute;top:22px;height:18px;font-size:10px;color:var(--muted);border-left:1px solid #eceef2;padding-left:3px;line-height:18px;}

  .empty-chain-row{background:var(--panel);padding:10px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);}
  .empty-chain-row.chain-start{border-top:2px solid var(--border);}
  .empty-chain-row button{margin-left:8px;}

  .sku-logo,.sku-logo-fallback{width:22px;height:22px;border-radius:50%;flex:none;}
  .sku-logo{object-fit:cover;border:1px solid var(--border);background:#fff;}
  .sku-logo-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:9.5px;}
  .sku-color-dot{width:8px;height:8px;border-radius:50%;flex:none;}

  .bar{position:absolute;height:26px;border-radius:5px;top:4px;cursor:grab;display:flex;align-items:center;padding:0 6px;font-size:11.5px;color:#12203f;overflow:hidden;white-space:nowrap;border-left:5px solid var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.08);user-select:none;}
  .bar:active{cursor:grabbing;}
  .bar .handle{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;}
  .bar .handle.left{left:0;}
  .bar .handle.right{right:0;}
  .bar.status-planned{opacity:.55;}
  .bar.status-confirmed{opacity:.8;}
  .bar.status-live{opacity:1;box-shadow:0 0 0 2px var(--accent-light);}
  .bar.status-complete{opacity:1;}
  .bar .badge{font-weight:700;margin-right:4px;font-size:9.5px;background:rgba(255,255,255,.65);padding:0 3px;border-radius:3px;}

  .tooltip{position:fixed;z-index:50;background:#111827;color:#fff;font-size:12px;padding:8px 10px;border-radius:6px;max-width:260px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);line-height:1.5;}
  .tooltip b{color:#fff;}
  .tooltip .row{display:flex;justify-content:space-between;gap:10px;}
  .tooltip .muted{color:#9ca3af;}

  /* Table view */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px;}
  thead th{text-align:left;background:#fafbfc;border-bottom:1px solid var(--border);padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;}
  tbody td{padding:8px 10px;border-bottom:1px solid #f0f1f4;}
  tbody tr:hover{background:#f8f9fb;}
  .flag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .row-actions button{padding:3px 7px;font-size:11.5px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:100;overflow:auto;padding:24px;}
  .modal{background:var(--panel);border-radius:10px;width:480px;max-width:92vw;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h2{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:50px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .modal-actions .right{display:flex;gap:8px;}
  .list-item{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid #f0f1f4;}
  .list-item .swatch-img,.list-item .swatch-fallback{width:26px;height:26px;border-radius:6px;flex:none;}
  .list-item .swatch-img{object-fit:cover;border:1px solid var(--border);}
  .list-item .swatch-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10.5px;}
  .list-item .meta{flex:1;font-size:12.5px;min-width:0;}
  .list-item .meta .n{font-weight:700;}
  .list-item .meta .c{color:var(--muted);}
  .empty-note{color:var(--muted);font-size:12px;padding:20px;text-align:center;}
  .hint{color:var(--muted);font-size:11.5px;margin-top:-6px;margin-bottom:10px;}
  .logo-upload{display:flex;align-items:center;gap:10px;}
  .logo-upload .preview,.logo-upload .preview-fallback{width:44px;height:44px;border-radius:8px;flex:none;}
  .logo-upload .preview{object-fit:cover;border:1px solid var(--border);background:#f7f7f8;}
  .logo-upload .preview-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .logo-upload .col{flex:1;display:flex;flex-direction:column;gap:6px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Promo Timeline Tracker</h1>
    <div class="sub">Bottleshop chain promotions, by SKU &middot; drag bars to shift dates, drag edges to resize, double-click empty space to add a deal</div>
  </div>
  <div class="toolbar">
    <div class="view-toggle">
      <button id="viewTimelineBtn" class="active">Timeline</button>
      <button id="viewTableBtn">Table</button>
    </div>
    <button id="manageChainsBtn">Manage Chains</button>
    <button id="manageProductsBtn">Manage SKUs</button>
    <button class="primary" id="addDealBtn">+ Add Deal</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</header>

<main>
  <div class="filters">
    <div><label>Chain</label><select id="filterChain"><option value="all">All chains</option></select></div>
    <div><label>SKU</label><select id="filterProduct"><option value="all">All SKUs</option></select></div>
    <div><label>Status</label><select id="filterStatus">
      <option value="all">All statuses</option>
      <option value="planned">Planned</option>
      <option value="confirmed">Confirmed</option>
      <option value="live">Live</option>
      <option value="complete">Complete</option>
    </select></div>
    <div><label>Search</label><input type="text" id="filterSearch" placeholder="SKU or promo name"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>Meeting/above target margin</span>
      <span><span class="dot" style="background:var(--red)"></span>Below target margin</span>
      <span><span class="dot" style="background:var(--amber)"></span>No actual recorded yet</span>
    </div>
  </div>
  <div class="sku-legend" id="skuLegend"></div>

  <div id="timelineView">
    <div class="gantt-wrap">
      <div class="gantt-nav">
        <button id="zoomMonth">Month</button>
        <button id="zoomQuarter">Quarter</button>
        <button id="zoomYear">Year</button>
        <span style="width:1px;background:var(--border);align-self:stretch;"></span>
        <button id="scrollToday">Jump to Today</button>
        <span style="margin-left:auto;color:var(--muted);font-size:12px;" id="rangeLabel"></span>
      </div>
      <div class="gantt-body">
        <div class="gantt-frozen">
          <div class="frozen-header"><div class="fh-rail">Chain</div><div class="fh-label">SKU</div></div>
          <div class="frozen-viewport">
            <div class="frozen-inner" id="frozenInner"></div>
          </div>
        </div>
        <div class="gantt-scroll" id="ganttScroll">
          <div class="gantt-grid" id="ganttGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="tableView" style="display:none;">
    <table>
      <thead>
        <tr>
          <th data-sort="chain">Chain</th>
          <th data-sort="product">SKU</th>
          <th data-sort="cycleInstance">Cycle</th>
          <th data-sort="promoName">Promo</th>
          <th data-sort="startDate">Start</th>
          <th data-sort="endDate">End</th>
          <th data-sort="targetMarginPct">Target %</th>
          <th data-sort="actualMarginPct">Actual %</th>
          <th data-sort="status">Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "promoTimelineTracker_v2";
  var OLD_STORAGE_KEY = "promoTimelineTracker_v1";
  var PALETTE = ["#2563eb","#059669","#d97706","#7c3aed","#db2777","#0891b2","#65a30d","#dc2626","#4f46e5","#0d9488"];

  /* ---------- data ---------- */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function todayISO(){ return fmtDate(new Date()); }
  function fmtDate(d){ var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),day=("0"+d.getDate()).slice(-2); return y+"-"+m+"-"+day; }
  function parseDate(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function diffDays(a,b){ return Math.round((b-a)/86400000); }
  function initials(name){ name=(name||"?").trim(); var parts=name.split(/\s+/); return ((parts[0]||"")[0]||"?").toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase(); }

  function seedData(){
    var y = new Date().getFullYear();
    var chains = [
      {id:"c1", name:"Chain A (example)", cycleLabel:"Catalogue Cycle", cycleLengthWeeks:4, cycleAnchorDate:y+"-01-01", color:PALETTE[0], logo:null},
      {id:"c2", name:"Chain B (example)", cycleLabel:"Promo Period", cycleLengthWeeks:6, cycleAnchorDate:y+"-01-06", color:PALETTE[1], logo:null},
      {id:"c3", name:"Chain C (example)", cycleLabel:"Flyer Cycle", cycleLengthWeeks:2, cycleAnchorDate:y+"-01-13", color:PALETTE[2], logo:null},
      {id:"c4", name:"Chain D (example)", cycleLabel:"Feature Window", cycleLengthWeeks:8, cycleAnchorDate:null, color:PALETTE[3], logo:null}
    ];
    var products = [
      {id:"p1", skuCode:"YMB-LAG-24", name:"Lager 24pk", color:PALETTE[0], logo:null},
      {id:"p2", skuCode:"YMB-IPA-6", name:"IPA 6pk", color:PALETTE[1], logo:null},
      {id:"p3", skuCode:"YMB-PAL-24", name:"Pale Ale 24pk", color:PALETTE[2], logo:null},
      {id:"p4", skuCode:"YMB-CID-6", name:"Cider 6pk", color:PALETTE[3], logo:null},
      {id:"p5", skuCode:"YMB-LAG-6", name:"Lager 6pk", color:PALETTE[4], logo:null}
    ];
    var deals = [
      {id:uid(), chainId:"c1", productId:"p1", promoName:"Summer Kickoff", cycleInstance:"Cycle 1", startDate:y+"-01-05", endDate:y+"-02-01", targetMarginPct:22, actualMarginPct:23.5, status:"complete", notes:""},
      {id:uid(), chainId:"c1", productId:"p2", promoName:"Autumn Multibuy", cycleInstance:"Cycle 3", startDate:y+"-03-02", endDate:y+"-03-29", targetMarginPct:20, actualMarginPct:17.5, status:"complete", notes:"Rebate came in lower than agreed"},
      {id:uid(), chainId:"c1", productId:"p1", promoName:"Winter Warmer", cycleInstance:"Cycle 6", startDate:y+"-06-08", endDate:y+"-07-05", targetMarginPct:22, actualMarginPct:null, status:"confirmed", notes:""},
      {id:uid(), chainId:"c2", productId:"p3", promoName:"Founders Feature", cycleInstance:"Period 2", startDate:y+"-02-10", endDate:y+"-03-23", targetMarginPct:18, actualMarginPct:19.2, status:"complete", notes:""},
      {id:uid(), chainId:"c2", productId:"p2", promoName:"EOFY Push", cycleInstance:"Period 5", startDate:y+"-06-01", endDate:y+"-07-12", targetMarginPct:18, actualMarginPct:null, status:"planned", notes:""},
      {id:uid(), chainId:"c3", productId:"p5", promoName:"Weekend Flyer", cycleInstance:"Flyer 08", startDate:y+"-02-24", endDate:y+"-03-09", targetMarginPct:15, actualMarginPct:15.4, status:"complete", notes:""},
      {id:uid(), chainId:"c3", productId:"p4", promoName:"Long Weekend Flyer", cycleInstance:"Flyer 12", startDate:y+"-04-14", endDate:y+"-04-27", targetMarginPct:15, actualMarginPct:14.1, status:"complete", notes:""},
      {id:uid(), chainId:"c3", productId:"p5", promoName:"Spring Flyer", cycleInstance:"Flyer 20", startDate:y+"-09-08", endDate:y+"-09-21", targetMarginPct:15, actualMarginPct:null, status:"live", notes:""},
      {id:uid(), chainId:"c4", productId:"p3", promoName:"Regional Feature", cycleInstance:"Window 3", startDate:y+"-05-04", endDate:y+"-06-29", targetMarginPct:19, actualMarginPct:null, status:"confirmed", notes:""},
      {id:uid(), chainId:"c4", productId:"p4", promoName:"Holiday Feature", cycleInstance:"Window 6", startDate:y+"-11-02", endDate:y+"-12-27", targetMarginPct:19, actualMarginPct:null, status:"planned", notes:""}
    ];
    return {chains:chains, products:products, deals:deals};
  }

  function migrateV1(od){
    var products = [];
    var byKey = {};
    (od.deals||[]).forEach(function(d){
      var key = (d.skuCode||"")+"|"+(d.skuName||"");
      if(!byKey[key]){
        var p = { id: uid(), skuCode: d.skuCode || ("SKU"+(products.length+1)), name: d.skuName || d.skuCode || "Unnamed SKU", color: PALETTE[products.length % PALETTE.length], logo:null };
        products.push(p);
        byKey[key] = p.id;
      }
      d.productId = byKey[key];
      delete d.skuCode; delete d.skuName;
    });
    var chains = (od.chains||[]).map(function(c){ c.logo = c.logo||null; c.cycleAnchorDate = c.cycleAnchorDate||null; return c; });
    return { chains:chains, products:products, deals: od.deals||[] };
  }

  function normalize(d){
    if(!d.products) d.products = [];
    if(!d.chains) d.chains = [];
    if(!d.deals) d.deals = [];
    d.chains.forEach(function(c){
      if(c.cycleAnchorDate===undefined) c.cycleAnchorDate = null;
      if(c.logo===undefined) c.logo = null;
    });
    d.products.forEach(function(p){ if(p.logo===undefined) p.logo = null; });
    return d;
  }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        return normalize(JSON.parse(raw));
      }
      var old = localStorage.getItem(OLD_STORAGE_KEY);
      if(old){
        var migrated = migrateV1(JSON.parse(old));
        saveData(migrated);
        return migrated;
      }
    }catch(e){ console.warn("Could not load saved data, starting fresh.", e); }
    var seeded = seedData();
    saveData(seeded);
    return seeded;
  }
  function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

  var DATA = loadData();

  /* ---------- state ---------- */
  var state = {
    view: "timeline",
    zoom: "quarter", // month | quarter | year
    filters: { chainId:"all", productId:"all", status:"all", search:"" },
    sort: { key:"startDate", dir:1 }
  };
  var PX = { month: 26, quarter: 9, year: 3.2 };

  /* ---------- helpers ---------- */
  function getChain(id){ return DATA.chains.find(function(c){return c.id===id;}); }
  function getProduct(id){ return DATA.products.find(function(p){return p.id===id;}); }
  function marginStatus(deal){
    if(deal.actualMarginPct===null || deal.actualMarginPct===undefined || deal.actualMarginPct==="") return "pending";
    return deal.actualMarginPct >= deal.targetMarginPct ? "met" : "below";
  }
  function marginColor(status){ return status==="met"?"var(--green)": status==="below"?"var(--red)":"var(--amber)"; }
  function statusBadge(s){ return {planned:"PLN",confirmed:"CFM",live:"LIVE",complete:"DONE"}[s] || s; }

  // Each chain can run its own P1-P52 style cycle numbering starting from a different anchor
  // date ("the date of P1"), since chains' cycles don't line up with each other. Given a
  // chain and a candidate start date, work out which numbered cycle that date falls in.
  // P-cycles are always weekly (P1, P2, P3... 7 days apart) regardless of how long a typical
  // promo runs for. These three helpers convert between a chain's cycle numbers and real dates.
  function dateToCycleNumber(chain, dateStr){
    if(!chain || !chain.cycleAnchorDate || !dateStr) return null;
    var anchor = parseDate(chain.cycleAnchorDate), d = parseDate(dateStr);
    if(!isSaneDate(anchor) || !isSaneDate(d)) return null;
    var n = Math.floor(diffDays(anchor, d) / 7) + 1;
    return n < 1 ? 1 : n;
  }
  function cycleStartDate(chain, n){ return addDays(parseDate(chain.cycleAnchorDate), (n-1)*7); }
  function cycleEndDate(chain, n){ return addDays(parseDate(chain.cycleAnchorDate), n*7 - 1); }
  function computeCycleLabel(chain, dateStr){
    var n = dateToCycleNumber(chain, dateStr);
    return n ? ("P"+n) : null;
  }

  function filteredDeals(){
    return DATA.deals.filter(function(d){
      if(state.filters.chainId!=="all" && d.chainId!==state.filters.chainId) return false;
      if(state.filters.productId!=="all" && d.productId!==state.filters.productId) return false;
      if(state.filters.status!=="all" && d.status!==state.filters.status) return false;
      if(state.filters.search){
        var q = state.filters.search.toLowerCase();
        var prod = getProduct(d.productId) || {};
        var hay = ((prod.skuCode||"")+" "+(prod.name||"")+" "+d.promoName+" "+(d.cycleInstance||"")).toLowerCase();
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
  }

  /* ---------- filter dropdowns / legend ---------- */
  function refreshFilterOptions(){
    var selC = document.getElementById("filterChain");
    var curC = selC.value;
    selC.innerHTML = '<option value="all">All chains</option>' + DATA.chains.map(function(c){
      return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>';
    }).join("");
    if([...selC.options].some(function(o){return o.value===curC;})) selC.value = curC;

    var selP = document.getElementById("filterProduct");
    var curP = selP.value;
    selP.innerHTML = '<option value="all">All SKUs</option>' + DATA.products.map(function(p){
      return '<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>';
    }).join("");
    if([...selP.options].some(function(o){return o.value===curP;})) selP.value = curP;

    var legend = document.getElementById("skuLegend");
    legend.innerHTML = DATA.products.map(function(p){
      return '<span class="chip"><span class="dot" style="background:'+p.color+'"></span>'+escapeHtml(p.name)+' <span style="opacity:.7">('+escapeHtml(p.skuCode)+')</span></span>';
    }).join("") || '<span style="opacity:.7">No SKUs yet — add one via "Manage SKUs".</span>';
  }

  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  function logoOrFallback(entity, cls, fallbackCls, radiusStyle){
    if(entity && entity.logo){
      return '<img class="'+cls+'" src="'+entity.logo+'" alt="">';
    }
    var bg = (entity && entity.color) || "#9ca3af";
    return '<div class="'+fallbackCls+'" style="background:'+bg+'">'+initials(entity && entity.name)+'</div>';
  }

  /* ---------- TIMELINE RENDER ---------- */
  var rangeStart, rangeEnd, totalDays, pxPerDay;

  // A single mistyped year (e.g. a native date input registering "0026" instead of "2026")
  // would otherwise stretch the whole shared timeline across centuries and squash every other
  // bar down to an invisible sliver. Dates outside this window are treated as data-entry
  // errors and ignored when sizing the visible range (the deal itself is untouched).
  var SANE_YEAR_MIN = 2000, SANE_YEAR_MAX = 2100;
  function isSaneDate(dt){ return dt && !isNaN(dt.getTime()) && dt.getFullYear()>=SANE_YEAR_MIN && dt.getFullYear()<=SANE_YEAR_MAX; }

  function computeRange(){
    var y = new Date().getFullYear();
    var minD = new Date(y,0,1), maxD = new Date(y,11,31);
    DATA.deals.forEach(function(d){
      var s = parseDate(d.startDate), e = parseDate(d.endDate);
      if(!isSaneDate(s) || !isSaneDate(e)){
        console.warn("Skipping a deal with an implausible date when sizing the timeline:", d);
        return;
      }
      if(s<minD) minD = s;
      if(e>maxD) maxD = e;
    });
    rangeStart = addDays(minD, -14);
    rangeEnd = addDays(maxD, 14);
    totalDays = diffDays(rangeStart, rangeEnd);
    pxPerDay = PX[state.zoom];
  }

  var EMPTY_ROW_H = 40;

  function renderTimeline(){
    computeRange();
    var totalPx = Math.round(totalDays * pxPerDay);
    var grid = document.getElementById("ganttGrid");
    var frozen = document.getElementById("frozenInner");
    grid.style.gridTemplateColumns = totalPx + "px";

    var trackHtml = '<div class="axis-cell track-cell" style="grid-row:1;width:'+totalPx+'px;">' + axisHtml() + '</div>';
    var frozenHtml = "";

    var deals = filteredDeals();
    var chainsToShow = DATA.chains.filter(function(c){
      return state.filters.chainId==="all" || state.filters.chainId===c.id;
    });

    if(chainsToShow.length===0){
      grid.innerHTML = trackHtml + '<div style="padding:24px;color:var(--muted);">No chains yet. Click "Manage Chains" to add one.</div>';
      frozen.innerHTML = "";
      frozen.style.transform = "translateY(0px)";
      document.getElementById("rangeLabel").textContent = "";
      return;
    }

    var rowIndex = 2;
    chainsToShow.forEach(function(chain){
      var chainStartRow = rowIndex;

      if(chain.cycleAnchorDate){
        var startCls = rowIndex===chainStartRow ? " chain-start" : "";
        frozenHtml += '<div class="cycle-label-cell'+startCls+'" style="grid-column:1/-1;grid-row:'+rowIndex+';height:18px;">Cycle (P#)</div>';
        trackHtml += '<div class="cycle-row'+startCls+'" style="grid-row:'+rowIndex+';height:18px;width:'+totalPx+'px;">' + cycleRowHtml(chain) + '</div>';
        rowIndex++;
      }

      var chainDeals = deals.filter(function(d){ return d.chainId===chain.id; });

      if(chainDeals.length===0){
        var eCls = rowIndex===chainStartRow ? " chain-start" : "";
        frozenHtml += '<div class="empty-chain-row'+eCls+'" style="grid-column:1/-1;grid-row:'+rowIndex+';height:'+EMPTY_ROW_H+'px;">No deals yet.<button class="ghost" data-add-deal-chain="'+chain.id+'">+ Add</button></div>';
        trackHtml += '<div class="track-cell'+eCls+'" style="grid-row:'+rowIndex+';height:'+EMPTY_ROW_H+'px;width:'+totalPx+'px;"></div>';
        rowIndex++;
      } else {
        var productIds = [];
        chainDeals.forEach(function(d){ if(productIds.indexOf(d.productId)===-1) productIds.push(d.productId); });
        productIds.sort(function(a,b){
          var pa = getProduct(a), pb = getProduct(b);
          return (pa?pa.name:"").localeCompare(pb?pb.name:"");
        });

        productIds.forEach(function(pid){
          var product = getProduct(pid);
          if(!product) return;
          var prodDeals = chainDeals.filter(function(d){ return d.productId===pid; });
          var lanes = packLanes(prodDeals);
          var laneCount = Math.max(lanes.length, 1);
          var rowH = laneCount * 34 + 10;
          var sCls = rowIndex===chainStartRow ? " chain-start" : "";

          frozenHtml += '<div class="label-cell'+sCls+'" style="grid-row:'+rowIndex+';height:'+rowH+'px;">' +
            '<div class="sku-row-top">' +
              logoOrFallback(product, "sku-logo", "sku-logo-fallback") +
              '<span class="sku-color-dot" style="background:'+product.color+'"></span>' +
              '<span class="sku-name">'+escapeHtml(product.name)+'</span>' +
              '<span class="sku-actions">' +
                '<button class="ghost" data-edit-product="'+product.id+'" title="Edit SKU">Edit</button>' +
                '<button class="ghost" data-add-deal-chain="'+chain.id+'" data-add-deal-product="'+product.id+'" title="Add deal for this SKU/chain">+</button>' +
              '</span>' +
            '</div>' +
            '<div class="sku-code">'+escapeHtml(product.skuCode)+'</div>' +
            '</div>';

          trackHtml += '<div class="track-cell'+sCls+'" data-chain="'+chain.id+'" data-product="'+product.id+'" style="grid-row:'+rowIndex+';height:'+rowH+'px;width:'+totalPx+'px;">' +
            gridLinesHtml() + todayLineHtml() +
            lanes.map(function(laneDeals, laneIdx){
              return laneDeals.map(function(d){ return barHtml(d, product, laneIdx); }).join("");
            }).join("") +
            '</div>';
          rowIndex++;
        });
      }

      var numRows = rowIndex - chainStartRow;
      frozenHtml += '<div class="chain-rail chain-start" style="grid-column:1;grid-row:'+chainStartRow+' / span '+numRows+';">' +
        logoOrFallback(chain, "logo", "logo-fallback") +
        '<span class="name">'+escapeHtml(chain.name)+'</span>' +
        '<span class="cycle-pill">'+escapeHtml(chain.cycleLabel)+' &middot; '+chain.cycleLengthWeeks+'wk</span>' +
        '<span class="rail-actions">' +
          '<button class="ghost" data-edit-chain="'+chain.id+'" title="Edit chain">Edit</button>' +
          '<button class="ghost" data-add-deal-chain="'+chain.id+'" title="Add deal">+</button>' +
        '</span>' +
        '</div>';
    });

    grid.innerHTML = trackHtml;
    frozen.innerHTML = frozenHtml;
    document.getElementById("rangeLabel").textContent = fmtDate(rangeStart)+" → "+fmtDate(rangeEnd);
    attachBarHandlers();
    attachLabelHandlers();
    attachTrackHandlers();
    // Re-sync the frozen pane's vertical offset in case the row count/heights changed and the
    // scroll container's scrollTop got clamped by the browser.
    var gs = document.getElementById("ganttScroll");
    frozen.style.transform = "translateY(-"+gs.scrollTop+"px)";
  }

  // Per-chain P1-P52 ruler: one tick every 7 days starting at the chain's own P1 anchor date,
  // rendered in that chain's local coordinate system (each chain can start its weeks on a
  // different date, so this can't be a single shared axis).
  function cycleRowHtml(chain){
    if(!chain.cycleAnchorDate) return "";
    var anchor = parseDate(chain.cycleAnchorDate);
    if(!isSaneDate(anchor)) return "";
    var stepsBeforeStart = Math.floor(diffDays(anchor, rangeStart) / 7);
    var t = addDays(anchor, stepsBeforeStart * 7);
    var out = "", guard = 0;
    while(t <= rangeEnd && guard < 2000){
      var n = Math.floor(diffDays(anchor, t) / 7) + 1;
      if(n >= 1){
        var offset = diffDays(rangeStart, t) * pxPerDay;
        if(offset >= -40) out += '<div class="cycle-tick" style="left:'+Math.max(offset,0)+'px;">P'+n+'</div>';
      }
      t = addDays(t, 7);
      guard++;
    }
    return out;
  }

  function packLanes(deals){
    var sorted = deals.slice().sort(function(a,b){ return parseDate(a.startDate)-parseDate(b.startDate); });
    var lanes = [];
    sorted.forEach(function(d){
      var s = parseDate(d.startDate);
      var placed = false;
      for(var i=0;i<lanes.length;i++){
        var lastInLane = lanes[i][lanes[i].length-1];
        if(parseDate(lastInLane.endDate) <= s){ lanes[i].push(d); placed=true; break; }
      }
      if(!placed) lanes.push([d]);
    });
    return lanes;
  }

  function axisHtml(){
    var out = "";
    var cur = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
    while(cur <= rangeEnd){
      var offset = diffDays(rangeStart, cur) * pxPerDay;
      var nextMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      var label = cur.toLocaleDateString(undefined,{month:"short", year: cur.getMonth()===0 ? "numeric":undefined});
      out += '<div class="axis-month" style="left:'+Math.max(offset,0)+'px;">'+label+'</div>';
      if(state.zoom!=="year"){
        var w = new Date(cur);
        while(w < nextMonth && w <= rangeEnd){
          var wOffset = diffDays(rangeStart, w) * pxPerDay;
          if(wOffset>=0) out += '<div class="axis-week" style="left:'+wOffset+'px;">'+w.getDate()+'</div>';
          w = addDays(w, 7);
        }
      }
      cur = nextMonth;
    }
    return out;
  }

  function gridLinesHtml(){
    var out = "";
    var cur = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
    while(cur <= rangeEnd){
      var offset = diffDays(rangeStart, cur) * pxPerDay;
      if(offset>=0) out += '<div class="month-line major" style="left:'+offset+'px;"></div>';
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    return out;
  }
  function todayLineHtml(){
    var t = new Date(); t.setHours(0,0,0,0);
    if(t<rangeStart || t>rangeEnd) return "";
    var offset = diffDays(rangeStart, t) * pxPerDay;
    return '<div class="today-line" style="left:'+offset+'px;" title="Today"></div>';
  }

  function barHtml(d, product, laneIdx){
    var s = parseDate(d.startDate), e = parseDate(d.endDate);
    var left = diffDays(rangeStart, s) * pxPerDay;
    var width = Math.max(diffDays(s,e) * pxPerDay, 10);
    var top = laneIdx*34 + 6;
    var mStatus = marginStatus(d);
    var bg = product.color + "3d";
    return '<div class="bar status-'+d.status+'" data-deal="'+d.id+'" style="left:'+left+'px;width:'+width+'px;top:'+top+'px;background:'+bg+';border-left-color:'+marginColor(mStatus)+';">' +
      '<span class="handle left" data-handle="left"></span>' +
      '<span class="badge">'+statusBadge(d.status)+'</span>' +
      '<span>'+escapeHtml(d.promoName)+'</span>' +
      '<span class="handle right" data-handle="right"></span>' +
      '</div>';
  }

  /* ---------- drag / resize ---------- */
  var drag = null;
  function attachBarHandlers(){
    document.querySelectorAll(".bar").forEach(function(bar){
      bar.addEventListener("mouseenter", function(e){ showTooltip(bar, e); });
      bar.addEventListener("mousemove", function(e){ positionTooltip(e); });
      bar.addEventListener("mouseleave", hideTooltip);
      bar.addEventListener("mousedown", function(e){ startDrag(e, bar); });
      bar.addEventListener("click", function(e){
        if(bar.dataset.dragged==="1"){ bar.dataset.dragged="0"; return; }
        openDealModal(DATA.deals.find(function(d){return d.id===bar.dataset.deal;}));
      });
    });
  }
  function attachTrackHandlers(){
    document.querySelectorAll(".track-cell[data-chain]").forEach(function(cell){
      cell.addEventListener("dblclick", function(e){
        // Ignore double-clicks that land on an existing bar (or its handles) — those are for
        // editing that deal, not creating a new one on empty space.
        if(e.target !== cell) return;
        var chainId = cell.dataset.chain, productId = cell.dataset.product;
        var chain = getChain(chainId);
        var clickX = e.offsetX;
        var dayOffset = Math.round(clickX / pxPerDay);
        var startDate = addDays(rangeStart, dayOffset);
        var cycleDays = chain ? Math.max(chain.cycleLengthWeeks*7, 1) : 14;
        var endDate = addDays(startDate, cycleDays - 1);
        openDealModal(null, chainId, productId, { startDate: fmtDate(startDate), endDate: fmtDate(endDate) });
      });
    });
  }
  function attachLabelHandlers(){
    document.querySelectorAll("[data-edit-chain]").forEach(function(btn){
      btn.addEventListener("click", function(){ openChainModal(getChain(btn.dataset.editChain)); });
    });
    document.querySelectorAll("[data-edit-product]").forEach(function(btn){
      btn.addEventListener("click", function(){ openProductModal(getProduct(btn.dataset.editProduct)); });
    });
    document.querySelectorAll("[data-add-deal-chain]").forEach(function(btn){
      btn.addEventListener("click", function(){ openDealModal(null, btn.dataset.addDealChain, btn.dataset.addDealProduct); });
    });
  }

  function startDrag(e, bar){
    var handle = e.target.getAttribute("data-handle");
    e.preventDefault();
    var deal = DATA.deals.find(function(d){return d.id===bar.dataset.deal;});
    var startX = e.clientX;
    var origStart = parseDate(deal.startDate), origEnd = parseDate(deal.endDate);
    drag = { deal:deal, bar:bar, handle:handle, startX:startX, origStart:origStart, origEnd:origEnd, moved:false };
    hideTooltip();
    document.addEventListener("mousemove", onDragMove);
    document.addEventListener("mouseup", onDragEnd);
  }
  function onDragMove(e){
    if(!drag) return;
    var dx = e.clientX - drag.startX;
    var dayDelta = Math.round(dx / pxPerDay);
    if(dayDelta===0) return;
    drag.moved = true;
    drag.bar.dataset.dragged = "1";
    var newStart = drag.origStart, newEnd = drag.origEnd;
    if(drag.handle==="left"){
      newStart = addDays(drag.origStart, dayDelta);
      if(newStart >= newEnd) newStart = addDays(newEnd, -1);
    } else if(drag.handle==="right"){
      newEnd = addDays(drag.origEnd, dayDelta);
      if(newEnd <= newStart) newEnd = addDays(newStart, 1);
    } else {
      newStart = addDays(drag.origStart, dayDelta);
      newEnd = addDays(drag.origEnd, dayDelta);
    }
    var left = diffDays(rangeStart, newStart) * pxPerDay;
    var width = Math.max(diffDays(newStart,newEnd) * pxPerDay, 10);
    drag.bar.style.left = left+"px";
    drag.bar.style.width = width+"px";
    drag._newStart = newStart; drag._newEnd = newEnd;
  }
  function onDragEnd(){
    if(drag && drag.moved){
      drag.deal.startDate = fmtDate(drag._newStart);
      drag.deal.endDate = fmtDate(drag._newEnd);
      saveData(DATA);
      renderAll();
    }
    document.removeEventListener("mousemove", onDragMove);
    document.removeEventListener("mouseup", onDragEnd);
    drag = null;
  }

  /* ---------- tooltip ---------- */
  var tooltipEl = null;
  function showTooltip(bar, e){
    var deal = DATA.deals.find(function(d){return d.id===bar.dataset.deal;});
    var chain = getChain(deal.chainId);
    var product = getProduct(deal.productId);
    hideTooltip();
    tooltipEl = document.createElement("div");
    tooltipEl.className = "tooltip";
    var mStatus = marginStatus(deal);
    var mLabel = mStatus==="met" ? "Meeting target" : mStatus==="below" ? "Below target" : "No actual yet";
    tooltipEl.innerHTML =
      '<div><b>'+escapeHtml(deal.promoName)+'</b></div>' +
      '<div class="muted">'+escapeHtml(chain?chain.name:"")+' &middot; '+escapeHtml(deal.cycleInstance||"")+'</div>' +
      '<div class="row"><span>SKU</span><span>'+escapeHtml(product?product.skuCode:"")+' '+escapeHtml(product?product.name:"")+'</span></div>' +
      '<div class="row"><span>Dates</span><span>'+deal.startDate+' → '+deal.endDate+'</span></div>' +
      '<div class="row"><span>Target margin</span><span>'+deal.targetMarginPct+'%</span></div>' +
      '<div class="row"><span>Actual margin</span><span>'+(deal.actualMarginPct===null||deal.actualMarginPct===undefined?"—":deal.actualMarginPct+"%")+' ('+mLabel+')</span></div>' +
      '<div class="row"><span>Status</span><span>'+deal.status+'</span></div>';
    document.body.appendChild(tooltipEl);
    positionTooltip(e);
  }
  function positionTooltip(e){
    if(!tooltipEl) return;
    tooltipEl.style.left = (e.clientX+14)+"px";
    tooltipEl.style.top = (e.clientY+14)+"px";
  }
  function hideTooltip(){ if(tooltipEl){ tooltipEl.remove(); tooltipEl=null; } }

  /* ---------- TABLE VIEW ---------- */
  function renderTable(){
    var deals = filteredDeals().slice();
    var key = state.sort.key, dir = state.sort.dir;
    deals.sort(function(a,b){
      var av, bv;
      if(key==="chain"){ av=(getChain(a.chainId)||{}).name||""; bv=(getChain(b.chainId)||{}).name||""; }
      else if(key==="product"){ av=(getProduct(a.productId)||{}).name||""; bv=(getProduct(b.productId)||{}).name||""; }
      else { av=a[key]; bv=b[key]; }
      if(av===null||av===undefined) av="";
      if(bv===null||bv===undefined) bv="";
      if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
    });
    var tbody = document.getElementById("tableBody");
    if(deals.length===0){
      tbody.innerHTML = '<tr><td colspan="10" class="empty-note">No deals match the current filters.</td></tr>';
      return;
    }
    tbody.innerHTML = deals.map(function(d){
      var chain = getChain(d.chainId);
      var product = getProduct(d.productId);
      var mStatus = marginStatus(d);
      return '<tr>' +
        '<td>'+escapeHtml(chain?chain.name:"?")+'</td>' +
        '<td><span class="sku-color-dot" style="background:'+(product?product.color:"#ccc")+';display:inline-block;margin-right:5px;"></span>'+escapeHtml(product?product.name:"?")+'<br><span style="color:var(--muted);font-size:11px;">'+escapeHtml(product?product.skuCode:"")+'</span></td>' +
        '<td>'+escapeHtml(d.cycleInstance||"")+'</td>' +
        '<td>'+escapeHtml(d.promoName)+'</td>' +
        '<td>'+d.startDate+'</td>' +
        '<td>'+d.endDate+'</td>' +
        '<td>'+d.targetMarginPct+'%</td>' +
        '<td>'+(d.actualMarginPct===null||d.actualMarginPct===undefined?"—":d.actualMarginPct+"%")+'</td>' +
        '<td><span class="flag" style="background:'+marginColor(mStatus)+'"></span>'+d.status+'</td>' +
        '<td class="row-actions"><button data-tbl-edit="'+d.id+'">Edit</button> <button data-tbl-dup="'+d.id+'">Dup</button> <button class="danger" data-tbl-del="'+d.id+'">Del</button></td>' +
        '</tr>';
    }).join("");
    tbody.querySelectorAll("[data-tbl-edit]").forEach(function(b){
      b.addEventListener("click", function(){ openDealModal(DATA.deals.find(function(d){return d.id===b.dataset.tblEdit;})); });
    });
    tbody.querySelectorAll("[data-tbl-dup]").forEach(function(b){
      b.addEventListener("click", function(){ duplicateDeal(DATA.deals.find(function(d){return d.id===b.dataset.tblDup;})); });
    });
    tbody.querySelectorAll("[data-tbl-del]").forEach(function(b){
      b.addEventListener("click", function(){ deleteDeal(b.dataset.tblDel); });
    });
  }

  /* ---------- MODALS ---------- */
  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

  function logoUploadFieldHtml(prefix, currentLogo, currentColor, currentName){
    return '<div class="field"><label>Logo (optional)</label>' +
      '<div class="logo-upload">' +
        (currentLogo ? '<img class="preview" id="'+prefix+'_preview" src="'+currentLogo+'">' : '<div class="preview-fallback" id="'+prefix+'_preview" style="background:'+(currentColor||"#9ca3af")+'">'+initials(currentName)+'</div>') +
        '<div class="col">' +
          '<input type="file" accept="image/*" id="'+prefix+'_file">' +
          '<input type="text" id="'+prefix+'_logo" placeholder="...or paste an image URL" value="'+escapeHtml(currentLogo && currentLogo.indexOf("data:")!==0 ? currentLogo : "")+'">' +
        '</div>' +
      '</div>' +
      '</div>';
  }
  function wireLogoUpload(prefix, colorInputId, nameInputId){
    var fileInput = document.getElementById(prefix+"_file");
    var urlInput = document.getElementById(prefix+"_logo");
    var preview = document.getElementById(prefix+"_preview");
    var current = urlInput.value || null;
    function updatePreview(src){
      var color = colorInputId ? document.getElementById(colorInputId).value : "#9ca3af";
      var name = nameInputId ? document.getElementById(nameInputId).value : "";
      if(src){
        var img = document.createElement("img");
        img.className = "preview"; img.id = prefix+"_preview"; img.src = src;
        preview.replaceWith(img); preview = img;
      } else {
        var div = document.createElement("div");
        div.className = "preview-fallback"; div.id = prefix+"_preview";
        div.style.background = color; div.textContent = initials(name);
        preview.replaceWith(div); preview = div;
      }
    }
    fileInput.addEventListener("change", function(){
      var f = fileInput.files[0];
      if(!f) return;
      var reader = new FileReader();
      reader.onload = function(ev){ current = ev.target.result; urlInput.value = ""; updatePreview(current); };
      reader.readAsDataURL(f);
    });
    urlInput.addEventListener("input", function(){ current = urlInput.value.trim() || null; updatePreview(current); });
    return function getLogoValue(){ return current; };
  }

  function openDealModal(deal, presetChainId, presetProductId, prefill){
    var isNew = !deal;
    var d = deal ? Object.assign({}, deal) : Object.assign({
      id:uid(), chainId: presetChainId || (DATA.chains[0] && DATA.chains[0].id) || "",
      productId: presetProductId || (DATA.products[0] && DATA.products[0].id) || "",
      promoName:"", cycleInstance:"",
      startDate: todayISO(), endDate: fmtDate(addDays(new Date(),13)),
      targetMarginPct:20, actualMarginPct:null, status:"planned", notes:""
    }, prefill||{});
    if(DATA.products.length===0){ alert('Add at least one SKU first via "Manage SKUs".'); return; }
    if(DATA.chains.length===0){ alert('Add at least one chain first via "Manage Chains".'); return; }
    var chainOptions = DATA.chains.map(function(c){ return '<option value="'+c.id+'" '+(c.id===d.chainId?"selected":"")+'>'+escapeHtml(c.name)+'</option>'; }).join("");
    var productOptions = DATA.products.map(function(p){ return '<option value="'+p.id+'" '+(p.id===d.productId?"selected":"")+'>'+escapeHtml(p.skuCode)+' — '+escapeHtml(p.name)+'</option>'; }).join("");
    var initialChain = getChain(d.chainId);
    var initialUseCycle = !!(initialChain && initialChain.cycleAnchorDate);
    var initStartCycle = initialUseCycle ? (dateToCycleNumber(initialChain, d.startDate) || 1) : 1;
    var initEndCycle = initialUseCycle ? (dateToCycleNumber(initialChain, d.endDate) || 1) : 1;
    var html = '<div class="modal-backdrop"><div class="modal">' +
      '<h2>'+(isNew?"Add Deal":"Edit Deal")+'</h2>' +
      '<div class="field-row">' +
        '<div class="field"><label>Chain</label><select id="f_chainId">'+chainOptions+'</select></div>' +
        '<div class="field"><label>SKU</label><select id="f_productId">'+productOptions+'</select></div>' +
      '</div>' +
      '<div class="hint">Don\'t see the SKU or chain you need? Add it via "Manage SKUs" / "Manage Chains" first.</div>' +
      '<div class="field"><label>Promo name</label><input id="f_promoName" value="'+escapeHtml(d.promoName)+'"></div>' +
      '<div id="dateModeFields" style="display:'+(initialUseCycle?"none":"")+';">' +
        '<div class="field"><label>Cycle instance (optional label)</label><input id="f_cycleInstance" placeholder="e.g. Period 6" value="'+escapeHtml(d.cycleInstance)+'"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Start date</label><input type="date" id="f_startDate" value="'+d.startDate+'"></div>' +
          '<div class="field"><label>End date</label><input type="date" id="f_endDate" value="'+d.endDate+'"></div>' +
        '</div>' +
        '<div class="hint">Set this chain\'s Cycle 1 / P1 date in Manage Chains to enter promos by cycle number instead.</div>' +
      '</div>' +
      '<div id="cycleModeFields" style="display:'+(initialUseCycle?"":"none")+';">' +
        '<div class="field-row">' +
          '<div class="field"><label>Start cycle</label><div style="display:flex;align-items:center;gap:6px;"><span>P</span><input type="number" min="1" id="f_startCycle" value="'+initStartCycle+'"></div></div>' +
          '<div class="field"><label>End cycle</label><div style="display:flex;align-items:center;gap:6px;"><span>P</span><input type="number" min="1" id="f_endCycle" value="'+initEndCycle+'"></div></div>' +
        '</div>' +
        '<div class="hint" id="f_cyclePreview" style="margin-top:-6px;"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Target margin %</label><input type="number" step="0.1" id="f_target" value="'+d.targetMarginPct+'"></div>' +
        '<div class="field"><label>Actual margin % (leave blank if not run yet)</label><input type="number" step="0.1" id="f_actual" value="'+(d.actualMarginPct===null||d.actualMarginPct===undefined?"":d.actualMarginPct)+'"></div>' +
      '</div>' +
      '<div class="field"><label>Status</label><select id="f_status">' +
        ["planned","confirmed","live","complete"].map(function(s){return '<option value="'+s+'" '+(s===d.status?"selected":"")+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>';}).join("") +
      '</select></div>' +
      '<div class="field"><label>Notes</label><textarea id="f_notes">'+escapeHtml(d.notes||"")+'</textarea></div>' +
      '<div class="modal-actions">' +
        '<div>'+(isNew?"":'<button class="ghost" id="duplicateDealBtn">Duplicate</button> <button class="danger" id="deleteDealBtn">Delete Deal</button>')+'</div>' +
        '<div class="right"><button id="cancelDealBtn">Cancel</button><button class="primary" id="saveDealBtn">Save</button></div>' +
      '</div>' +
      '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;

    function updateCyclePreview(){
      var chain = getChain(document.getElementById("f_chainId").value);
      var previewEl = document.getElementById("f_cyclePreview");
      if(!chain || !chain.cycleAnchorDate) { previewEl.textContent = ""; return; }
      var sc = parseInt(document.getElementById("f_startCycle").value, 10);
      var ec = parseInt(document.getElementById("f_endCycle").value, 10);
      if(!sc || sc<1){ previewEl.textContent = "Start cycle must be P1 or later."; return; }
      if(!ec || ec<sc){ previewEl.textContent = "End cycle must be P"+sc+" or later."; return; }
      var s = cycleStartDate(chain, sc), e = cycleEndDate(chain, ec);
      previewEl.innerHTML = '= <b>'+fmtDate(s)+' → '+fmtDate(e)+'</b> ('+(diffDays(s,e)+1)+' days)';
    }
    function refreshCycleModeVisibility(){
      var chain = getChain(document.getElementById("f_chainId").value);
      var useCycle = !!(chain && chain.cycleAnchorDate);
      document.getElementById("dateModeFields").style.display = useCycle ? "none" : "";
      document.getElementById("cycleModeFields").style.display = useCycle ? "" : "none";
      if(useCycle){
        if(!document.getElementById("f_startCycle").value) document.getElementById("f_startCycle").value = dateToCycleNumber(chain, document.getElementById("f_startDate").value) || 1;
        if(!document.getElementById("f_endCycle").value) document.getElementById("f_endCycle").value = dateToCycleNumber(chain, document.getElementById("f_endDate").value) || 1;
        updateCyclePreview();
      }
    }
    refreshCycleModeVisibility();
    document.getElementById("f_chainId").addEventListener("change", refreshCycleModeVisibility);
    document.getElementById("f_startCycle").addEventListener("input", updateCyclePreview);
    document.getElementById("f_endCycle").addEventListener("input", updateCyclePreview);

    document.getElementById("cancelDealBtn").addEventListener("click", closeModal);
    if(!isNew){
      document.getElementById("deleteDealBtn").addEventListener("click", function(){ closeModal(); deleteDeal(d.id); });
      document.getElementById("duplicateDealBtn").addEventListener("click", function(){ closeModal(); duplicateDeal(deal); });
    }
    document.getElementById("saveDealBtn").addEventListener("click", function(){
      var chain = getChain(document.getElementById("f_chainId").value);
      var useCycle = !!(chain && chain.cycleAnchorDate);
      var startDate, endDate, cycleInstance;
      if(useCycle){
        var sc = parseInt(document.getElementById("f_startCycle").value, 10);
        var ec = parseInt(document.getElementById("f_endCycle").value, 10);
        if(!sc || sc<1){ alert("Start cycle must be P1 or later."); return; }
        if(!ec || ec<sc){ alert("End cycle must be the same as or after the start cycle."); return; }
        startDate = fmtDate(cycleStartDate(chain, sc));
        endDate = fmtDate(cycleEndDate(chain, ec));
        cycleInstance = sc===ec ? ("P"+sc) : ("P"+sc+"–P"+ec);
      } else {
        startDate = document.getElementById("f_startDate").value;
        endDate = document.getElementById("f_endDate").value;
        cycleInstance = document.getElementById("f_cycleInstance").value.trim();
      }
      var newD = {
        id: d.id,
        chainId: document.getElementById("f_chainId").value,
        productId: document.getElementById("f_productId").value,
        promoName: document.getElementById("f_promoName").value.trim(),
        cycleInstance: cycleInstance,
        startDate: startDate,
        endDate: endDate,
        targetMarginPct: parseFloat(document.getElementById("f_target").value) || 0,
        actualMarginPct: document.getElementById("f_actual").value===""? null : parseFloat(document.getElementById("f_actual").value),
        status: document.getElementById("f_status").value,
        notes: document.getElementById("f_notes").value
      };
      if(!newD.chainId || !newD.productId){ alert("Please select a chain and a SKU."); return; }
      if(!newD.startDate || !newD.endDate){ alert("Start and end dates are required."); return; }
      if(!isSaneDate(parseDate(newD.startDate)) || !isSaneDate(parseDate(newD.endDate))){
        alert("One of these dates' years looks off. Double check it — a quick way this happens is a date field registering \"0026\" instead of \""+new Date().getFullYear()+"\" when typing fast, which would badly stretch the whole timeline.");
        return;
      }
      if(parseDate(newD.endDate) <= parseDate(newD.startDate)){ alert("End date must be after start date."); return; }
      if(isNew){ DATA.deals.push(newD); }
      else { var idx = DATA.deals.findIndex(function(x){return x.id===d.id;}); DATA.deals[idx] = newD; }
      saveData(DATA);
      closeModal();
      renderAll();
    });
  }

  function duplicateDeal(deal){
    openDealModal(null, deal.chainId, deal.productId, {
      promoName: deal.promoName,
      cycleInstance: deal.cycleInstance,
      startDate: deal.startDate,
      endDate: deal.endDate,
      targetMarginPct: deal.targetMarginPct,
      actualMarginPct: null,
      status: "planned",
      notes: deal.notes
    });
  }

  function deleteDeal(id){
    if(!confirm("Delete this deal? This cannot be undone.")) return;
    DATA.deals = DATA.deals.filter(function(d){return d.id!==id;});
    saveData(DATA);
    renderAll();
  }

  function openChainModal(chain){
    var isNew = !chain;
    var c = chain ? Object.assign({}, chain) : { id:uid(), name:"", cycleLabel:"", cycleLengthWeeks:4, color: PALETTE[DATA.chains.length % PALETTE.length], logo:null };

    var listHtml = DATA.chains.map(function(ch){
      return '<div class="list-item">' +
        logoOrFallback(ch, "swatch-img", "swatch-fallback") +
        '<div class="meta"><div class="n">'+escapeHtml(ch.name)+'</div><div class="c">'+escapeHtml(ch.cycleLabel)+' &middot; '+ch.cycleLengthWeeks+' wk cycle</div></div>' +
        '<button class="ghost" data-cm-edit="'+ch.id+'">Edit</button>' +
        '<button class="ghost danger" data-cm-del="'+ch.id+'">Delete</button>' +
        '</div>';
    }).join("") || '<div class="empty-note">No chains yet.</div>';

    var html = '<div class="modal-backdrop"><div class="modal">' +
      '<h2>Manage Chains</h2>' +
      '<div style="max-height:220px;overflow:auto;margin-bottom:14px;">'+listHtml+'</div>' +
      '<h2 style="font-size:14px;">'+(isNew?"Add chain":"Edit chain")+'</h2>' +
      '<div class="field"><label>Chain name</label><input id="cf_name" value="'+escapeHtml(c.name)+'"></div>' +
      '<div class="field"><label>What they call their promo cycle</label><input id="cf_cycleLabel" placeholder="e.g. Catalogue, Period, Flyer" value="'+escapeHtml(c.cycleLabel)+'"></div>' +
      '<div class="hint">This label shows on the timeline so everyone uses the chain\'s own terminology.</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Accent color</label><input type="color" id="cf_color" value="'+c.color+'"></div>' +
        '<div class="field"><label>Typical promo duration (weeks)</label><input type="number" id="cf_weeks" value="'+c.cycleLengthWeeks+'"></div>' +
      '</div>' +
      '<div class="hint">How long a deal with this chain usually runs — used as the default length when you add a new deal.</div>' +
      '<div class="field"><label>Date of Cycle 1 / P1 (optional)</label><input type="date" id="cf_anchor" value="'+(c.cycleAnchorDate||"")+'"></div>' +
      '<div class="hint">This chain\'s P1-P52 weekly cycles: the date P1 begins. Cycles always run 7 days apart from there (P2 = 7 days after P1, and so on). Once set, you\'ll see a P1/P2/P3... ruler for this chain on the timeline, and the Add Deal form will suggest which cycle a promo falls in.</div>' +
      logoUploadFieldHtml("cf", c.logo, c.color, c.name) +
      '<div class="modal-actions">' +
        '<div></div>' +
        '<div class="right"><button id="cancelChainBtn">Close</button><button class="primary" id="saveChainBtn">'+(isNew?"Add chain":"Save changes")+'</button></div>' +
      '</div>' +
      '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;
    var getLogo = wireLogoUpload("cf", "cf_color", "cf_name");
    document.getElementById("cancelChainBtn").addEventListener("click", closeModal);
    document.querySelectorAll("[data-cm-edit]").forEach(function(b){
      b.addEventListener("click", function(){ openChainModal(getChain(b.dataset.cmEdit)); });
    });
    document.querySelectorAll("[data-cm-del]").forEach(function(b){
      b.addEventListener("click", function(){
        var chId = b.dataset.cmDel;
        var count = DATA.deals.filter(function(d){return d.chainId===chId;}).length;
        var msg = count>0 ? "This chain has "+count+" deal(s) on the timeline. Delete the chain AND all its deals?" : "Delete this chain?";
        if(!confirm(msg)) return;
        DATA.chains = DATA.chains.filter(function(x){return x.id!==chId;});
        DATA.deals = DATA.deals.filter(function(x){return x.chainId!==chId;});
        saveData(DATA);
        closeModal();
        renderAll();
      });
    });
    document.getElementById("saveChainBtn").addEventListener("click", function(){
      var name = document.getElementById("cf_name").value.trim();
      if(!name){ alert("Chain name is required."); return; }
      var anchor = document.getElementById("cf_anchor").value || null;
      if(anchor && !isSaneDate(parseDate(anchor))){
        alert("That Cycle 1 / P1 date's year looks off. Double check it — a quick way this happens is a date field registering \"0026\" instead of \""+new Date().getFullYear()+"\" when typing fast.");
        return;
      }
      var newC = {
        id: c.id,
        name: name,
        cycleLabel: document.getElementById("cf_cycleLabel").value.trim() || "Cycle",
        cycleLengthWeeks: parseInt(document.getElementById("cf_weeks").value,10) || 1,
        cycleAnchorDate: anchor,
        color: document.getElementById("cf_color").value,
        logo: getLogo()
      };
      if(isNew){ DATA.chains.push(newC); }
      else { var idx = DATA.chains.findIndex(function(x){return x.id===c.id;}); DATA.chains[idx] = newC; }
      saveData(DATA);
      closeModal();
      renderAll();
      openChainModal(null);
    });
  }

  function openProductModal(product){
    var isNew = !product;
    var p = product ? Object.assign({}, product) : { id:uid(), skuCode:"", name:"", color: PALETTE[DATA.products.length % PALETTE.length], logo:null };

    var listHtml = DATA.products.map(function(pr){
      return '<div class="list-item">' +
        logoOrFallback(pr, "swatch-img", "swatch-fallback") +
        '<div class="meta"><div class="n">'+escapeHtml(pr.name)+'</div><div class="c">'+escapeHtml(pr.skuCode)+'</div></div>' +
        '<button class="ghost" data-pm-edit="'+pr.id+'">Edit</button>' +
        '<button class="ghost danger" data-pm-del="'+pr.id+'">Delete</button>' +
        '</div>';
    }).join("") || '<div class="empty-note">No SKUs yet.</div>';

    var html = '<div class="modal-backdrop"><div class="modal">' +
      '<h2>Manage SKUs</h2>' +
      '<div style="max-height:220px;overflow:auto;margin-bottom:14px;">'+listHtml+'</div>' +
      '<h2 style="font-size:14px;">'+(isNew?"Add SKU":"Edit SKU")+'</h2>' +
      '<div class="field-row">' +
        '<div class="field"><label>SKU code</label><input id="pf_skuCode" value="'+escapeHtml(p.skuCode)+'"></div>' +
        '<div class="field"><label>Product name</label><input id="pf_name" value="'+escapeHtml(p.name)+'"></div>' +
      '</div>' +
      '<div class="field"><label>Color (used for this SKU on the timeline)</label><input type="color" id="pf_color" value="'+p.color+'"></div>' +
      logoUploadFieldHtml("pf", p.logo, p.color, p.name) +
      '<div class="modal-actions">' +
        '<div></div>' +
        '<div class="right"><button id="cancelProductBtn">Close</button><button class="primary" id="saveProductBtn">'+(isNew?"Add SKU":"Save changes")+'</button></div>' +
      '</div>' +
      '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;
    var getLogo = wireLogoUpload("pf", "pf_color", "pf_name");
    document.getElementById("cancelProductBtn").addEventListener("click", closeModal);
    document.querySelectorAll("[data-pm-edit]").forEach(function(b){
      b.addEventListener("click", function(){ openProductModal(getProduct(b.dataset.pmEdit)); });
    });
    document.querySelectorAll("[data-pm-del]").forEach(function(b){
      b.addEventListener("click", function(){
        var pid = b.dataset.pmDel;
        var count = DATA.deals.filter(function(d){return d.productId===pid;}).length;
        var msg = count>0 ? "This SKU has "+count+" deal(s) on the timeline. Delete the SKU AND all its deals?" : "Delete this SKU?";
        if(!confirm(msg)) return;
        DATA.products = DATA.products.filter(function(x){return x.id!==pid;});
        DATA.deals = DATA.deals.filter(function(x){return x.productId!==pid;});
        saveData(DATA);
        closeModal();
        renderAll();
      });
    });
    document.getElementById("saveProductBtn").addEventListener("click", function(){
      var name = document.getElementById("pf_name").value.trim();
      var skuCode = document.getElementById("pf_skuCode").value.trim();
      if(!name || !skuCode){ alert("SKU code and product name are required."); return; }
      var newP = {
        id: p.id,
        skuCode: skuCode,
        name: name,
        color: document.getElementById("pf_color").value,
        logo: getLogo()
      };
      if(isNew){ DATA.products.push(newP); }
      else { var idx = DATA.products.findIndex(function(x){return x.id===p.id;}); DATA.products[idx] = newP; }
      saveData(DATA);
      closeModal();
      renderAll();
      openProductModal(null);
    });
  }

  /* ---------- top-level wiring ---------- */
  function renderAll(){
    refreshFilterOptions();
    if(state.view==="timeline") renderTimeline(); else renderTable();
  }

  document.getElementById("viewTimelineBtn").addEventListener("click", function(){
    state.view="timeline";
    document.getElementById("viewTimelineBtn").classList.add("active");
    document.getElementById("viewTableBtn").classList.remove("active");
    document.getElementById("timelineView").style.display="";
    document.getElementById("tableView").style.display="none";
    renderAll();
  });
  document.getElementById("viewTableBtn").addEventListener("click", function(){
    state.view="table";
    document.getElementById("viewTableBtn").classList.add("active");
    document.getElementById("viewTimelineBtn").classList.remove("active");
    document.getElementById("timelineView").style.display="none";
    document.getElementById("tableView").style.display="";
    renderAll();
  });

  document.getElementById("addDealBtn").addEventListener("click", function(){ openDealModal(null); });
  document.getElementById("manageChainsBtn").addEventListener("click", function(){ openChainModal(null); });
  document.getElementById("manageProductsBtn").addEventListener("click", function(){ openProductModal(null); });

  document.getElementById("filterChain").addEventListener("change", function(e){ state.filters.chainId = e.target.value; renderAll(); });
  document.getElementById("filterProduct").addEventListener("change", function(e){ state.filters.productId = e.target.value; renderAll(); });
  document.getElementById("filterStatus").addEventListener("change", function(e){ state.filters.status = e.target.value; renderAll(); });
  document.getElementById("filterSearch").addEventListener("input", function(e){ state.filters.search = e.target.value; renderAll(); });

  document.getElementById("zoomMonth").addEventListener("click", function(){ state.zoom="month"; renderTimeline(); });
  document.getElementById("zoomQuarter").addEventListener("click", function(){ state.zoom="quarter"; renderTimeline(); });
  document.getElementById("zoomYear").addEventListener("click", function(){ state.zoom="year"; renderTimeline(); });
  document.getElementById("scrollToday").addEventListener("click", function(){
    var t = new Date(); t.setHours(0,0,0,0);
    var offset = diffDays(rangeStart, t) * pxPerDay;
    document.getElementById("ganttScroll").scrollLeft = Math.max(offset - 200, 0);
  });

  // Keep the frozen chain/SKU pane's vertical position glued to the scrollable timeline pane.
  // Attached once (not per-render) since #ganttScroll itself is never replaced by innerHTML.
  document.getElementById("ganttScroll").addEventListener("scroll", function(){
    document.getElementById("frozenInner").style.transform = "translateY(-"+this.scrollTop+"px)";
  });

  document.querySelectorAll("thead th[data-sort]").forEach(function(th){
    th.addEventListener("click", function(){
      var key = th.dataset.sort;
      if(state.sort.key===key) state.sort.dir *= -1; else { state.sort.key=key; state.sort.dir=1; }
      renderTable();
    });
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "promo-tracker-export-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed.chains || !parsed.deals) throw new Error("Missing chains/deals");
        if(!parsed.products) parsed.products = [];
        if(!confirm("Import will replace all current data in this browser. Continue?")) return;
        DATA = parsed;
        saveData(DATA);
        renderAll();
      }catch(err){
        alert("Could not import file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  renderAll();
  setTimeout(function(){ document.getElementById("scrollToday").click(); }, 50);
})();
</script>
